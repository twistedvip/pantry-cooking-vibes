{% extends "base.html" %}
{% set active_nav = 'recipes' %}
{% block title %}Edit {{ recipe.name }}{% endblock %}
{% block content %}
<p class="breadcrumbs"><a href="/recipes">← Recipes</a> / <a href="/recipes/{{ recipe.id }}">{{ recipe.name }}</a></p>

<h1 class="detail-title">Edit recipe</h1>

{% if error %}
<p class="form-error" role="alert">{{ error }}</p>
{% endif %}

<form class="recipe-edit-form" method="post" action="/recipes/{{ recipe.id }}/edit">
  <div class="edit-col">
    <label>
      Name
      <input type="text" name="name" value="{{ form.name }}" required maxlength="300">
    </label>

    <div class="field-row">
      <label>
        Cooking time (min)
        <input type="number" name="cooking_time_min" value="{{ form.cooking_time_min }}" min="0" step="1">
      </label>
      <label>
        Servings
        <input type="number" name="servings" value="{{ form.servings }}" min="1" step="1">
      </label>
    </div>

    <label>
      Picture URL
      <input type="text" name="image_url" value="{{ form.image_url }}" maxlength="2000"
             placeholder="https://…" inputmode="url">
      <span class="field-hint">Must start with http:// or https://. Leave blank for no picture.</span>
    </label>

    <label>
      Tags
      <textarea name="tags" rows="3" placeholder="quick, vegetarian, soup">{{ form.tags }}</textarea>
      <span class="field-hint">Comma-separated; saved lowercase.</span>
    </label>
  </div>

  <div class="edit-col">
    <label>
      Ingredients
      <textarea name="ingredients" rows="10" spellcheck="false">{{ form.ingredients }}</textarea>
      <span class="field-hint">One ingredient per line.</span>
      <span class="field-note">Unchanged lines keep their pantry mapping. Edited or new lines start unmapped, so they stop counting toward pantry coverage until re-mapped.</span>
    </label>

    <label>
      Steps
      <textarea name="instructions" rows="12">{{ form.instructions }}</textarea>
      <span class="field-hint">One step per line; a long step that wraps is still one step.</span>
    </label>
  </div>

  <div class="btn-row">
    <button type="submit" class="btn primary">Save changes</button>
    <a class="btn ghost" href="/recipes/{{ recipe.id }}">Cancel</a>
  </div>
</form>
{% endblock %}
